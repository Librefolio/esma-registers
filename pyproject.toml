[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esma-registers"
version = "0.1.0"
description = "Python library to read the ESMA public registers: the reference data of a financial instrument from FIRDS, by ISIN"
readme = "README.md"
license = {text = "LGPL-3.0-or-later"}
requires-python = ">=3.11"
authors = [
    {name = "LibreFolio Contributors"},
]
keywords = ["esma", "firds", "isin", "cfi", "lei", "reference-data", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["esma_registers*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that call the real ESMA register (never run by default)",
]
addopts = "-m 'not integration'"
